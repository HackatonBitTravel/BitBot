services:
  - type: web
    name: bitbot-api
    env: python
    plan: free
    region: oregon      
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: GOOGLE_API_KEY
        fromSecret: GOOGLE_API_KEY
